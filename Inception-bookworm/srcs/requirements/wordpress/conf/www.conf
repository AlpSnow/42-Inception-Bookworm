; [www]
;
; Définit un pool PHP-FPM.
;
; Un pool est un groupe de processus PHP (workers) qui exécutent
; les scripts PHP envoyés par le serveur web (nginx).
;
; PHP-FPM ne lance pas un seul processus PHP, mais plusieurs workers
; afin de pouvoir traiter plusieurs requêtes en même temps.
;
; Le pool "www" est le pool par défaut utilisé pour les applications web.
;
; Dans ce projet :
; nginx envoie les requêtes PHP vers le container WordPress
; sur le port 9000 (fastcgi_pass wordpress:9000).
; Les workers du pool [www] exécutent ensuite le code PHP de WordPress.
[www]

; PHP s’exécute avec l’utilisateur web standard :
user = www-data
group = www-data


; ligne la plus importante. Le pourquoi du comment on fait ce fichier
; Elle remplace :
; - /run/php/php8.2-fpm.sock
; par :
; - TCP 9000
; Ainsi nginx pourra faire :
; fastcgi_pass wordpress:9000;
listen = 9000
listen.owner = www-data
listen.group = www-data


; pm = dynamic : PHP-FPM gère les workers automatiquement
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3